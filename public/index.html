<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Subscription Monitor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="container">
    <header>
      <h1>Subscription Monitor</h1>
      <button id="theme-toggle" class="ghost theme-toggle" onclick="toggleTheme()" aria-label="Toggle light/dark theme" title="Toggle theme">◐</button>
      <div class="tabs" role="tablist" aria-label="Main sections">
        <button class="tab active" role="tab" id="tab-portfolio" aria-selected="true" aria-controls="portfolio" data-tab="portfolio" onclick="showTab('portfolio')">Portfolio</button>
        <button class="tab" role="tab" id="tab-subscriptions" aria-selected="false" aria-controls="subscriptions" data-tab="subscriptions" tabindex="-1" onclick="showTab('subscriptions')">Subscriptions</button>
        <button class="tab" role="tab" id="tab-models" aria-selected="false" aria-controls="models" data-tab="models" tabindex="-1" onclick="showTab('models')">Models &amp; Prices</button>
        <button class="tab" role="tab" id="tab-calculator" aria-selected="false" aria-controls="calculator" data-tab="calculator" tabindex="-1" onclick="showTab('calculator')">Calculator</button>
        <button class="tab" role="tab" id="tab-alerts" aria-selected="false" aria-controls="alerts" data-tab="alerts" tabindex="-1" onclick="showTab('alerts')">Alerts</button>
        <button class="tab" role="tab" id="tab-history" aria-selected="false" aria-controls="history" data-tab="history" tabindex="-1" onclick="showTab('history')">History</button>
        <button class="tab" role="tab" id="tab-compare" aria-selected="false" aria-controls="compare" data-tab="compare" tabindex="-1" onclick="showTab('compare')">Compare</button>
      </div>
    </header>
    <div id="portfolio" role="tabpanel" aria-labelledby="tab-portfolio" tabindex="0" class="tab-content"><div id="portfolio-content"></div></div>
    <div id="subscriptions" role="tabpanel" aria-labelledby="tab-subscriptions" tabindex="0" class="tab-content hidden">
      <div class="card" style="margin-bottom:24px">
        <h3 style="margin-bottom:16px">Add Subscription</h3>
        <form class="form" onsubmit="addSub();return false;">
          <div><label for="provider">Provider</label><select id="provider"><option value="opencode-go">OpenCode Go</option><option value="commandcode">CommandCode GOAT</option></select>
          <div><label for="label">Label</label><input id="label" type="text" placeholder="Label (e.g. Work account)" autocomplete="off" /></div>
          <div><label for="apiKey">API Key</label><input id="apiKey" placeholder="API Key" type="password" required autocomplete="off" /></div>
          <button type="submit">Add</button>
        </form>
      </div>
      <div id="subs-list"></div>
    </div>
    <div id="models" role="tabpanel" aria-labelledby="tab-models" tabindex="0" class="tab-content hidden">
      <div class="toolbar">
        <label for="model-search" class="small">Search</label><input id="model-search" placeholder="Search models..." oninput="debouncedFilterModels()" aria-label="Search models" />
        <label for="provider-filter" class="small">Provider</label><select id="provider-filter" onchange="filterModels()" aria-label="Filter by provider"><option value="all">All Providers</option><option value="opencode-go">OpenCode Go</option><option value="commandcode">CommandCode</option></select>
        <label for="sort-by" class="small">Sort by</label><select id="sort-by" onchange="this.dataset.touched='1';sortModels()" aria-label="Sort by"><option value="name">Sort: Name</option><option value="input">Sort: Input Price</option><option value="output">Sort: Output Price</option><option value="context">Sort: Context Window</option></select>
        <label for="sort-dir" class="small">Direction</label><select id="sort-dir" onchange="this.dataset.touched='1';sortModels()" aria-label="Sort direction"><option value="asc">Ascending</option><option value="desc">Descending</option></select>
      </div>
      <div id="models-count" class="small label" role="status" aria-live="polite" style="margin-bottom:8px"></div><div id="models-content"></div>
    </div>
    <div id="calculator" role="tabpanel" aria-labelledby="tab-calculator" tabindex="0" class="tab-content hidden"><div id="calculator-content"></div></div>
    <div id="alerts" role="tabpanel" aria-labelledby="tab-alerts" tabindex="0" class="tab-content hidden"><div id="alerts-content"></div></div>
    <div id="history" role="tabpanel" aria-labelledby="tab-history" tabindex="0" class="tab-content hidden"><div id="history-content"></div></div>
    <div id="compare" role="tabpanel" aria-labelledby="tab-compare" tabindex="0" class="tab-content hidden"><div id="compare-content"></div></div>
  </div>
  <div id="toast-root" aria-live="polite"></div>
  <div id="modal-root"></div>
  <button class="refresh-btn" id="refresh-fab" onclick="refreshAll()" title="Refresh" aria-label="Refresh all data">↻</button>
  <script src="/app.js" defer></script>
</body>
</html>
